# LEKA staging, on one machine.
#
# WHY ONE MACHINE. docs/architecture.md sets the constraint this whole file
# obeys: two developers, part time, no dedicated operator. Everything that
# needs someone to look after it — a cluster, a service mesh, a managed
# cache — is a recurring cost in attention that this team does not have. One
# EC2 instance running four containers is a thing you can hold in your head
# and rebuild from this file in ten minutes.
#
# WHY NOT App Runner, which was the other candidate: AWS closed it to new
# accounts. It also only runs HTTP services, and the worker is an RQ process
# that never serves a request. See docs/adr/014-hosting.md.
#
# WHAT IS DELIBERATELY NOT HERE
#   - Postgres. Neon already runs it, managed and backed up, and a database
#     on this box would be the one thing on it that cannot be rebuilt.
#   - A load balancer. Caddy terminates TLS, and an ALB is billed by the
#     hour whether or not anyone visits.
#   - The web application. Scoped out of this pass; see the ADR for what it
#     needs (`output: "standalone"` in next.config.ts) and why it is next.
#
#   docker compose -f docker-compose.staging.yml --env-file staging.env up -d

name: leka-staging

x-app: &app
  # Never `latest`. A tag that moves means "what is running?" has no answer,
  # and rollback has nothing to roll back to. The pipeline writes the commit
  # sha here; see .github/workflows/cd.yml.
  image: ghcr.io/${GITHUB_REPOSITORY:-haitam-elh/leka}/api:${LEKA_RELEASE:?set LEKA_RELEASE to a commit sha}
  restart: unless-stopped
  env_file: [staging.env]
  environment:
    LEKA_ENVIRONMENT: staging
    LEKA_REDIS_URL: redis://redis:6379/0
    # The image is built from one commit; this is how an error in Sentry
    # names it. "Releases are traceable" is this line.
    LEKA_RELEASE: ${LEKA_RELEASE}
  depends_on:
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    # A staging box with no log rotation fills its disk and takes the
    # application down with it, which is a tedious way to learn this.
    options: { max-size: "10m", max-file: "3" }

services:
  # Runs to completion before the API and the worker start. A container that
  # migrates on its own startup races the other one that is also migrating.
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-haitam-elh/leka}/api:${LEKA_RELEASE:?set LEKA_RELEASE to a commit sha}
    env_file: [staging.env]
    environment:
      LEKA_ENVIRONMENT: staging
      LEKA_REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy

  api:
    <<: *app
    # The container's own healthcheck already probes Postgres and Redis and
    # answers 503 when either is down, so Caddy stops sending it traffic.
    expose: ["8000"]

  worker:
    <<: *app
    command: ["sh", "-c", "rq worker --url \"$$LEKA_REDIS_URL\" leka:high leka leka:low"]
    # Inherited from the image, and wrong here: the worker serves no HTTP,
    # so the API's healthcheck would mark it unhealthy for ever and restart
    # it in a loop.
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence on purpose. The queue is a queue: LEKA-334 stores what
    # must survive in `events` and `job_runs`, in Postgres, and re-dispatches
    # from there. A Redis that loses its memory costs a re-dispatch, and a
    # Redis with an AOF file on a staging box costs a disk to look after.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Certificates and account keys. Losing this volume means asking Let's
  # Encrypt for a new certificate, which is rate limited.
  caddy-data:
  caddy-config:
