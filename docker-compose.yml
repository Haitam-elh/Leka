# LEKA local development infrastructure.
#
# This file provides BACKING SERVICES ONLY. The API and the web app run on the
# host, so that reloads are instant and debuggers attach normally. See
# docs/setup.md.
#
#   docker compose up -d
#
# Every value below has a working default: `docker compose up` succeeds on a
# clean machine with no .env file. Override any of them in .env when a port is
# already taken locally.

name: leka

services:
  postgres:
    # pgvector's own image, built on the official postgres:16. The `vector`
    # extension ships with the image but is NOT enabled in the database —
    # Alembic migration 001 runs CREATE EXTENSION, so a database created by
    # any other means (RDS, Cloud SQL) goes through the exact same path.
    image: pgvector/pgvector:pg16
    container_name: leka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leka}
      POSTGRES_DB: ${POSTGRES_DB:-leka}
      # Fail fast on a corrupted volume instead of starting degraded.
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      # Bound to the loopback interface on purpose: this database has a
      # throwaway password and must not be reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `docker compose up` is only "enough" if the API can tell when Postgres
      # is actually accepting connections — the process is up several seconds
      # before that. /api/v1/health and CI both rely on this.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leka} -d ${POSTGRES_DB:-leka} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    # Queue backend for RQ (background loop) and short-lived caches.
    image: redis:7-alpine
    container_name: leka-redis
    # appendonly: a queue that loses jobs on restart wastes a developer's
    # afternoon looking for a bug that is not in the code.
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio:
    # An S3-compatible object store, for the raw payloads that deliberately
    # do not live in PostgreSQL (docs/adr/010-object-storage.md).
    #
    # It is here so that tests/test_s3_against_minio.py runs by default
    # rather than skipping. S3ObjectStore is what production uses, and the
    # only other thing exercising it is a stand-in we wrote ourselves —
    # which agrees with what we BELIEVE S3 does. A real server disagrees
    # where it matters: it refuses a delete of more than 1000 keys, and our
    # stand-in accepts one happily.
    #
    # MinIO no longer publishes images (quay.io answers 401, Docker Hub's
    # minio/minio is gone — 2026-09-25). pgsty/minio is the same server,
    # rebuilt by the Pigsty project; pinned by digest, as in CI. An existing
    # leka-minio container keeps its old image until `docker compose up -d
    # minio` recreates it; the data volume is kept.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: leka-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Loopback only, like the others: throwaway credentials that must not
      # be reachable from the local network.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      # The web console, handy for looking at what a test actually wrote.
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mysql:
    # A customer's MySQL, for tests/test_mysql_connector.py (LEKA-349): the
    # connector reads a real server's catalogue, not a stand-in's idea of
    # it. Not LEKA's own database — nothing of LEKA's is stored in it.
    #
    # In a profile: `docker compose up -d` leaves it off; `docker compose
    # up -d mysql` starts it. Without it, those tests skip locally; CI starts
    # its own and requires them. No volume: every start is a clean server.
    image: mysql:8.4
    container_name: leka-mysql
    profiles: ["connectors"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-leka}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-leka}"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  mongodb:
    # A customer's MongoDB, for tests/test_mongodb_connector.py (LEKA-349),
    # as `mysql` above: in the `connectors` profile, off by default,
    # `docker compose up -d mongodb` to start it, a clean server each time.
    image: mongo:8.0
    container_name: leka-mongodb
    profiles: ["connectors"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-leka}
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  minio-data:
