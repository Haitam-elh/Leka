# The intention engine's benchmark (LEKA-440) — docs/benchmarks/intentions.md.
#
# Each case: what someone asks LEKA, on the demo company (scripts/seed.py,
# « Acme Corp »: payment-api and its 2.8.4 deployment followed by a sev2
# incident, its SLA its sources disagree on; auth-service, Thomas Berger's;
# user-service; postgres-prod; redis-sessions, removed six days ago; a
# payment runbook untouched for 243 days), and what LEKA must do with it.
#
# What a case may expect — every key optional; none means not checked:
#   mode            question | request
#   goal            the goals it may read (any of)
#   entities        things it must be about (names, all of them)
#   not_entities    things it must not be about
#   actions         {action: [targets]} — the actions on systems it asks,
#                   each on exactly those things; {} — none at all
#   withheld        actions spoken of but not asked (negated, conditional,
#                   doubtful): never one to act on
#   excluded        things it excludes (« sauf … »)
#   constraints     constraint kinds it says (read_only, window, urgency…)
#   environment     where it is held to
#   period_said     true: its period read from its words
#   expected        what it expects back: answer | document | plan | action
#   decision        what follows its brief (any of): analyse | clarify |
#                   continue | block
#   asks            questions it must ask (kinds, blocking or not)
#   must_not_ask    questions it must not ask
#   final           the intention's status once analysed (any of); refused:
#                   not kept, nothing to start from
#   analysis        the analysis' status (any of)
#   findings        what the analysis must state: its findings', its
#                   uncertainties' or what it misses' codes
#   cites           names its evidence or causes must name
#   decides         true: a decision is put to a person — never approved by
#                   LEKA, one approval at least
#   proposals       {action: [targets]} the decision proposes, exactly
#   next            what it takes (any of): ready | prerequisites |
#                   over_quota | impossible
#   needs           capabilities what it takes must list
#   confidence      how sure it may be (any of): unknown, low, medium, high —
#                   surer than all of them is a false claim (LEKA-441)
#   next_step       what it says to do next (any of): decide, prepare,
#                   settle_conflict, confirm_cause, ask_differently, rerun,
#                   fix_source, act, nothing
#   forbid          what must never happen:
#                     decision        a decision opened
#                     system_action   an action on systems read as asked
#                     cause_elsewhere a probable cause about anything but
#                                     what it asks about
#                     recommend_elsewhere a recommendation on anything else
#                     complete        the analysis said complete
#                     owner_claim     an owner stated
#
# input.faults: capabilities made to fail, as a worker dying would.
# input.answers: what its asker answered to LEKA's questions (LEKA-439).
# input.stage: brief — only what LEKA understood before asking is read (a
# deliverable an agent writes: no language model runs here).
#
# Which failures are critical is the check's, never the case's: a negation
# ignored, a wrong target, required evidence missing, an action despite a
# blocking ambiguity (docs/benchmarks/intentions.md § 3).
#
# Periods are said relative to now (« depuis 2 jours »), never to midnight
# (« depuis hier »): the demo's deployment, 26 hours ago, must be in it at
# any hour.

# 1: 58 cases, measured on understanding v4 — docs/benchmarks/intentions-initial.md.
# 2: 13 more — what a verb says without asking it, a thing left untouched, a
#    name known with one unknown, an action said as a noun (LEKA-440).
# 3: how sure it may be, and what to do next (LEKA-441).
# 4: every request is decided (2026-10-14): a question answered awaits its
#    asker's own decision — its agents, or by hand — said `answered`;
#    `awaiting_decision` is a decision on actions to systems.
version: 4
fixture: demo-seed

cases:
  # ── clear and direct ──────────────────────────────────────────────────
  - id: clear-cause-fr
    lang: fr
    tags: [clear, diagnostic]
    input: { text: "Pourquoi payment-api est lente depuis 2 jours ?" }
    expect:
      # Its SLA its sources disagree on, a source failing: never high (LEKA-441).
      confidence: [medium]
      next_step: [prepare, decide]
      mode: question
      goal: [explain_cause]
      entities: [payment-api]
      actions: {}
      expected: answer
      decision: [analyse]
      final: [answered]
      analysis: [complete, partial]
      findings: [change.made, incident.seen]
      cites: [payment-api v2.8.4]
      next: [ready]
      forbid: [decision, system_action, cause_elsewhere]

  - id: clear-cause-en
    lang: en
    tags: [clear, diagnostic]
    input: { text: "Why has payment-api been slow for the last 2 days?" }
    expect:
      mode: question
      goal: [explain_cause]
      entities: [payment-api]
      actions: {}
      decision: [analyse]
      final: [answered]
      findings: [change.made, incident.seen]
      cites: [payment-api v2.8.4]
      forbid: [decision, system_action, cause_elsewhere]

  - id: clear-owner-fr
    lang: fr
    tags: [clear, explanation]
    input: { text: "Qui est responsable de auth-service ?" }
    expect:
      # One source says who owns it: medium, said why.
      confidence: [medium, high]
      next_step: [nothing]
      mode: question
      goal: [find_owner]
      entities: [auth-service]
      actions: {}
      decision: [analyse]
      final: [answered]
      analysis: [complete]
      findings: [ownership.owner]
      cites: [Thomas Berger]
      next: [ready]
      forbid: [decision, system_action]

  - id: clear-owner-en
    lang: en
    tags: [clear, explanation]
    input: { text: "Who owns auth-service?" }
    expect:
      mode: question
      goal: [find_owner]
      entities: [auth-service]
      actions: {}
      decision: [analyse]
      final: [answered]
      findings: [ownership.owner]
      cites: [Thomas Berger]
      forbid: [decision, system_action]

  - id: clear-dependencies-fr
    lang: fr
