    input: { text: "Peux-tu redémarrer auth-service en production ce soir après 22h ?" }
    expect:
      mode: request
      actions: { restart: [auth-service] }
      environment: production
      constraints: [window]
      decision: [analyse]

  - id: urgent-rollback-fr
    lang: fr
    tags: [action, temporal, contradictory-context]
    input: { text: "Fais un rollback de payment-api en production, c'est urgent" }
    expect:
      mode: request
      actions: { rollback: [payment-api] }
      environment: production
      constraints: [urgency]
      # Its SLA its sources disagree on: never acted on as it stands.
      final: [needs_clarification, awaiting_decision]

  # ── a question that must not become an action ─────────────────────────
  - id: question-restarted-fr
    lang: fr
    tags: [question-not-action]
    input: { text: "Est-ce que payment-api a été redémarrée récemment ?" }
    expect:
