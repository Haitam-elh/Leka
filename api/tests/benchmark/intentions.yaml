    expect:
      mode: question
      entities: [payment-api]
      actions: {}
      forbid: [decision, system_action]

  - id: how-to-restart-fr
    lang: fr
    tags: [question-not-action, explanation]
    input: { text: "Comment redémarrer auth-service proprement ?" }
    expect:
      mode: question
      entities: [auth-service]
      actions: {}
      final: [answered]
      forbid: [decision, system_action]

  - id: risk-of-migrating-fr
    lang: fr
    tags: [question-not-action, plan]
    input: { text: "Évalue le risque de migrer payment-api vers Kubernetes" }
    expect:
      entities: [payment-api]
      forbid: [decision, system_action]

  - id: need-to-restart-fr
    lang: fr
