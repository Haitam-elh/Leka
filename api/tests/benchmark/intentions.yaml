      final: [answered]
      findings: [compliance.check]
      forbid: [decision, system_action]

  - id: clear-restart-fr
    lang: fr
    tags: [clear, action]
    input: { text: "Redémarre auth-service en production" }
    expect:
      mode: request
      goal: [act]
      entities: [auth-service]
      actions: { restart: [auth-service] }
      environment: production
      expected: action
      decision: [analyse]
      final: [awaiting_decision]
      findings: [action.asked, action.reach]
      decides: true
      proposals: { restart: [auth-service] }
      next: [ready]

  - id: clear-restart-en
    lang: en
    tags: [clear, action]
    input: { text: "Restart auth-service in production" }
    expect:
      mode: request
