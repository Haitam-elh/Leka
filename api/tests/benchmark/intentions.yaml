      findings: [dependency.relied_on]
      cites: [auth-service]
      forbid: [decision, system_action]

  - id: clear-dependents-en
    lang: en
    tags: [clear, explanation]
    input: { text: "What depends on postgres-prod?" }
    expect:
      mode: question
      goal: [map_dependencies, assess_impact]
      entities: [postgres-prod]
      actions: {}
      decision: [analyse]
      final: [answered]
      findings: [dependency.relied_on]
      forbid: [decision, system_action]

  - id: clear-procedure-fr
    lang: fr
