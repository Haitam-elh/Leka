    input: { text: "J'ai besoin de redémarrer auth-service en production" }
    expect:
      actions: { restart: [auth-service] }
      environment: production
      final: [awaiting_decision]
      decides: true
      proposals: { restart: [auth-service] }

  - id: do-a-rollback-en
    lang: en
    tags: [action, clear]
    input: { text: "Do a rollback of auth-service in production" }
    expect:
      actions: { rollback: [auth-service] }
      environment: production
      decides: true
      proposals: { rollback: [auth-service] }

