# The languages LEKA offers — the one source of truth (docs/languages.md).
#
# Read by the API (leka/core/languages.py, checked when read) and published
# to the web as web/public/languages.json (a test keeps the copy equal).
# Adding a language, or saying one is now translated, is an edit here — no
# product logic changes.
#
# A product-priority catalogue, not a ranking of the world's languages.
#
# Each language:
#   tag       its BCP 47 tag, canonical case: language, then a script only
#             where the language is written in more than one (zh-Hans,
#             zh-Hant). Never a region: the region is a setting of its own,
#             and the two combine into the formatting locale (pt + BR → pt-BR).
#   english   its name in English
#   native    its name in itself — what the picker shows first
#   script    ISO 15924 — how it is written
#   dir       rtl for right-to-left scripts; ltr when left out
#   parent    the language a missing translation falls back to before the
#             workspace's, when it is not simply the tag's own base
#             (Dari reads Persian, Cantonese Traditional Chinese)
#   ai        how well language models generally write it today — strong,
#             good or limited. LEKA's estimate across providers, never a
#             promise, revised as models change
#   ui        where LEKA's own words are translated, by surface:
#               reviewed    translated and approved by a person who speaks it
#               translated  translated, not yet approved
#               partial     some of it translated; the rest falls back
#             A surface left out is not translated: it falls back. Never
#             say translated what has not been.
#
# Surfaces: app (the application), site (leka-core.com), emails.

version: 2026-10-11

# The last language of every fallback chain.
default: en

languages:
