# LEKA CORE's commercial catalogue (LEKA-431, LEKA-446) — the ONE source of
# truth for its plans, their prices, discounts and trial, and what each
# includes. The pricing page, the API and checkout read it; nothing else
# states a price.
#
# The agents (LEKA-454): LEKA's own — its fundamental agents — are every
# plan's; specialised agents are monthly options, alone or in bundles (see
# `add_ons`). The AI capacity is the plan's and is never sold apart — no
# pack, no top-up, no overage: at the limit, what is billable stops and a
# higher plan is offered.
#
# Prices are in euro cents, excluding VAT. `provisional: true` marks a launch
# hypothesis — the AI-credit allowances above all — to be revisited once
# usage and cost metering (LEKA-430) has measured real usage; it is never
# shown as a guarantee. Change a value here, in a pull request: the page
# follows, nothing else to edit.
#
# Users (members and pending invitations) and sources: each plan's `quotas`,
# enforced by the server (leka/billing/limits.py, LEKA-463).
# Values not decided yet are absent, never guessed: workspaces per plan;
# agent and bundle prices.
#
# Quotas (2026-10-14, the product call — TODO: à valider): people, sources
# connected, standard analyses a month (what the AI credits come to, about
# 20 credits each), alert rules, recurring workflows. Over its plan's, a
# workspace is offered the next plan; what it already has is kept.
#
# Monitoring (LEKA-442, decided 2026-10-13, provisional): every plan sees its
# environment's states, their freshness and coverage; proactive alerts —
# in LEKA — from Starter, by e-mail too from Growth; Enterprise by contract.
#
# The AI credits a month are NOT here: they are the ones metering grants
# (LEKA-430, LEKA_PLAN_CREDITS — 200, 2,000, 10,000, 40,000), read from it,
# so what the page promises is what a workspace gets. Enterprise's are per
# contract.

version: "2026-10-14"
currency: EUR

# 20% off when billed yearly.
annual_discount_percent: 30

# The launch offer: 30% off the first 12 months, on monthly billing only —
# never stacked with the annual discount.
launch_offer:
  percent: 20
  months: 12
  intervals: [month]
  # Until when a new subscription may take it; empty: until further notice.
  ends_on: null

plans:
  - key: free
    name: Free
    monthly_price: 0
    self_service: true
    audience:
      fr: "Découvrir LEKA sur un premier périmètre."
      en: "Try LEKA on a first scope."
    value:
      fr: "Connectez vos premières sources et posez vos premières intentions."
      en: "Connect your first sources and ask your first intentions."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: false
    annual: false
    # LEKA-442: the states, their freshness and coverage, seen; no proactive alerts.
    monitoring: { proactive: false, provisional: true }
    quotas: { users: 1, sources: 3, analyses: 10, alert_rules: 0, workflows: 0, provisional: true }

  - key: starter
    name: Starter
    monthly_price: 5900
    self_service: true
    audience:
      fr: "Une petite équipe technique qui veut une vue claire de son SI."
      en: "A small engineering team that wants a clear view of its systems."
    value:
      fr: "Le modèle de votre environnement tenu à jour, et les alertes quand quelque chose ne va pas."
      en: "A continuously updated model of your environment, and alerts when something goes wrong."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app], provisional: true }
    quotas: { users: 1, sources: 5, analyses: 100, alert_rules: 5, workflows: 0, provisional: true }

  - key: growth
    name: Growth
    monthly_price: 17900
    self_service: true
    recommended: true
    # 14 days, a card required; then the subscription starts and the card is
    # charged, unless cancelled before (decided 2026-10-12). Once a workspace.
    trial_days: 14
    audience:
      fr: "Les équipes qui pilotent leur SI au quotidien avec LEKA."
      en: "Teams that run their systems with LEKA every day."
    value:
      fr: "Plus de capacité IA pour vos architectures, vos analyses et vos intentions, sur tout votre périmètre."
      en: "More AI capacity for your architectures, analyses and intentions, across your whole scope."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app, email], provisional: true }
    quotas: { users: 5, sources: 15, analyses: 500, alert_rules: 20, workflows: 10, provisional: true }

  - key: business
    name: Business
    monthly_price: 59900
    self_service: true
    audience:
      fr: "Les organisations à plusieurs équipes et plusieurs périmètres."
      en: "Organisations with several teams and scopes."
    value:
      fr: "La capacité IA d'une organisation à plusieurs équipes, sur tout son SI."
      en: "The AI capacity of an organisation with several teams, across its systems."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app, email], provisional: true }
    quotas: { users: 15, sources: 30, analyses: 2000, alert_rules: 100, workflows: 50, provisional: true }

  - key: enterprise
    name: Enterprise
    # Priced per contract: never a self-service checkout.
    monthly_price: null
    self_service: false
    audience:
      fr: "Les grandes organisations, avec leurs exigences de sécurité et leur propre modèle."
      en: "Large organisations, with their security requirements and their own model."
    value:
      fr: "Une capacité IA définie au contrat, et la possibilité de connecter votre propre modèle de langage."
      en: "AI capacity set by contract, and the option to connect your own language model."
    ai_credits_per_month: { contractual: true }
    managed_llm: true
    own_llm: true
    launch_offer: false
    annual: false
    monitoring: { proactive: true, alerts: [in_app, email], contractual: true }
    quotas: { contractual: true }

# The agents (LEKA-454, the subscription mock-up of 14 October — it replaces
# « no agent in a plan »): LEKA's own capabilities — understanding, the
# analysis, its answer: LEKA Assistant — are every plan's, its fundamental
# agents. Each plan also includes registry agents (`included`, decided by
# Karim on 2026-10-15): Starter three, Growth eight, Business all thirteen.
# Every agent its plan does not include is a specialised option, sold
# monthly, alone at its tier's price or in a bundle, from Starter; it runs
# while its option is active — granted only once Stripe confirms the
# payment.
#
# `agents`: the registry's agents on sale (agents/*/SKILL.md), each with its
# tier and the name the marketplace reference (« Agents & Bundles », 14
# October) gives it. Two have no equivalent there: their tier is LEKA's,
# to validate. `reference`: every agent the reference names — a reference
# is never a proof: one no registry agent stands for is never sold, never
# shown available. `bundles`: as the reference composes them, at its price;
# sold only once every member is. The inventory, regenerated by
# `python -m leka.capabilities.inventory`: docs/billing/agents-inventory.md.
#
# TODO: à valider — the tiers of architecture-analysis and code-change; the
# equivalences below; Migration Planner and Reliability Analyst, named by
# bundles but absent from the reference's list (unpriced: no saving shown);
# « Deployment & Release » and « Motion & Animation », read as the
# reference's « … Analyst » and « … Specialist ».
add_ons:
  available: true
  provisional: true
  # The least plan that buys or runs an option.
  minimum_plan: starter
  tiers:
    standard: 900
    specialized: 1500
    expert: 2500
  agents:
    application-architecture: { tier: expert, reference: architect }
    code-review: { tier: standard, reference: code-reviewer }
    test-analysis: { tier: standard, reference: test-strategist }
    incident-investigation: { tier: expert, reference: incident-investigator }
    debug-assistant: { tier: specialized, reference: bug-investigator }
    build-fixer: { tier: specialized, reference: build-error-resolver }
    security-review: { tier: expert, reference: security-reviewer }
    release-analysis: { tier: expert, reference: deployment-release-analyst }
    infrastructure-analysis: { tier: specialized, reference: infrastructure-architect }
    data-analysis: { tier: specialized, reference: data-analyst }
    documentation-assistant: { tier: standard, reference: documentation-specialist }
    # Frontend Craft (LEKA-461): each its reference agent.
    ui-quality-review: { tier: standard, reference: ui-quality-reviewer }
    accessibility-audit: { tier: standard, reference: accessibility-auditor }
    design-review: { tier: specialized, reference: design-reviewer }
    motion-review: { tier: specialized, reference: motion-animation-specialist }
    # Engineering (LEKA-461): each its reference agent.
    codebase-explorer: { tier: standard, reference: codebase-explorer }
    test-generation: { tier: standard, reference: test-generator }
    regression-analysis: { tier: specialized, reference: regression-analyst }
    change-impact-analysis: { tier: specialized, reference: change-impact-analyst }
    # No equivalent in the reference: LEKA's tier, to validate.
    architecture-analysis: { tier: specialized }
    code-change: { tier: expert }
  # Included in a plan, without an option — and in every plan above it
  # (Karim, 2026-10-15). Free runs none; Enterprise, by contract, every
  # one. Included agents' runs take the plan's AI credits; an agent of the
  # registry in draft is never included (only the agents above may be).
  included:
    starter: [code-review, test-analysis, documentation-assistant]
    growth: [architecture-analysis, infrastructure-analysis, data-analysis, debug-assistant, build-fixer]
    business: [application-architecture, code-change, security-review, incident-investigation, release-analysis]
    # Enterprise, by contract, every one: Frontend Craft's and Engineering's
    # too (LEKA-461) — built after Karim's matrix, options below until he says.
    enterprise:
      [ui-quality-review, accessibility-audit, design-review, motion-review,
       codebase-explorer, test-generation, regression-analysis, change-impact-analysis]
  reference:
    # product
    product-strategist: { name: "Product Strategist", category: product, tier: standard }
    spec-analyst: { name: "Spec Analyst", category: product, tier: standard }
    product-reviewer: { name: "Product Reviewer", category: product, tier: specialized }
    research-specialist: { name: "Research Specialist", category: product, tier: specialized }
    # architecture
    architect: { name: "Architect", category: architecture, tier: expert }
    codebase-explorer: { name: "Codebase Explorer", category: architecture, tier: standard }
    code-reviewer: { name: "Code Reviewer", category: architecture, tier: standard }
    code-simplifier: { name: "Code Simplifier", category: architecture, tier: specialized }
    refactoring-specialist: { name: "Refactoring Specialist", category: architecture, tier: specialized }
    # testing
    test-strategist: { name: "Test Strategist", category: testing, tier: standard }
    test-generator: { name: "Test Generator", category: testing, tier: standard }
    qa-analyst: { name: "QA Analyst", category: testing, tier: specialized }
    regression-analyst: { name: "Regression Analyst", category: testing, tier: specialized }
    e2e-testing-specialist: { name: "E2E Testing Specialist", category: testing, tier: specialized }
    # incident
    bug-investigator: { name: "Bug Investigator", category: incident, tier: specialized }
    incident-investigator: { name: "Incident Investigator", category: incident, tier: expert }
    change-impact-analyst: { name: "Change Impact Analyst", category: incident, tier: specialized }
    build-error-resolver: { name: "Build Error Resolver", category: incident, tier: specialized }
    silent-failure-hunter: { name: "Silent Failure Hunter", category: incident, tier: specialized }
    # security
    security-reviewer: { name: "Security Reviewer", category: security, tier: expert }
    dependency-analyst: { name: "Dependency Analyst", category: security, tier: specialized }
    vulnerability-scanner: { name: "Vulnerability Scanner", category: security, tier: specialized }
    compliance-auditor: { name: "Compliance Auditor", category: security, tier: specialized }
    security-advisor: { name: "Security Advisor", category: security, tier: specialized }
    # performance
    performance-analyst: { name: "Performance Analyst", category: performance, tier: expert }
    database-specialist: { name: "Database Specialist", category: performance, tier: specialized }
    api-design-reviewer: { name: "API Design Reviewer", category: performance, tier: specialized }
    data-analyst: { name: "Data Analyst", category: performance, tier: specialized }
    benchmark-analyst: { name: "Benchmark Analyst", category: performance, tier: specialized }
    # frontend
    ui-quality-reviewer: { name: "UI Quality Reviewer", category: frontend, tier: standard }
    accessibility-auditor: { name: "Accessibility Auditor", category: frontend, tier: standard }
    design-reviewer: { name: "Design Reviewer", category: frontend, tier: specialized }
    motion-animation-specialist: { name: "Motion & Animation Specialist", category: frontend, tier: specialized }
    prototype-designer: { name: "Prototype Designer", category: frontend, tier: specialized }
    # mobile
    ios-specialist: { name: "iOS Specialist", category: mobile, tier: specialized }
    android-specialist: { name: "Android Specialist", category: mobile, tier: specialized }
    react-specialist: { name: "React Specialist", category: mobile, tier: specialized }
    flutter-specialist: { name: "Flutter Specialist", category: mobile, tier: specialized }
    mobile-app-reviewer: { name: "Mobile App Reviewer", category: mobile, tier: specialized }
    # devops
    deployment-release-analyst: { name: "Deployment & Release Analyst", category: devops, tier: expert }
    canary-monitoring-specialist: { name: "Canary & Monitoring Specialist", category: devops, tier: specialized }
    infrastructure-architect: { name: "Infrastructure Architect", category: devops, tier: specialized }
    cloud-specialist: { name: "Cloud Specialist", category: devops, tier: specialized }
    container-kubernetes-specialist: { name: "Container & Kubernetes Specialist", category: devops, tier: specialized }
    # network
    network-architect: { name: "Network Architect", category: network, tier: specialized }
    network-config-reviewer: { name: "Network Config Reviewer", category: network, tier: specialized }
    network-troubleshooter: { name: "Network Troubleshooter", category: network, tier: specialized }
    system-administrator: { name: "System Administrator", category: network, tier: specialized }
    monitoring-specialist: { name: "Monitoring Specialist", category: network, tier: specialized }
    # documentation
    documentation-specialist: { name: "Documentation Specialist", category: documentation, tier: standard }
    spec-miner: { name: "Spec Miner", category: documentation, tier: specialized }
    context-manager: { name: "Context Manager", category: documentation, tier: specialized }
    knowledge-organizer: { name: "Knowledge Organizer", category: documentation, tier: specialized }
    diagram-specialist: { name: "Diagram Specialist", category: documentation, tier: standard }
    # orchestration
    planner: { name: "Planner", category: orchestration, tier: standard }
    auto-plan: { name: "Auto Plan", category: orchestration, tier: specialized }
    agent-evaluator: { name: "Agent Evaluator", category: orchestration, tier: specialized }
    harness-optimizer: { name: "Harness Optimizer", category: orchestration, tier: specialized }
    learning-specialist: { name: "Learning Specialist", category: orchestration, tier: specialized }
    # Named by a bundle, absent from the reference's list: unpriced.
    migration-planner: { name: "Migration Planner", category: devops }
    reliability-analyst: { name: "Reliability Analyst", category: incident }
  bundles:
    - key: engineering
      name: { fr: "Engineering", en: "Engineering" }
      value:
        fr: "Concevoir, relire et tester votre code."
        en: "Design, review and test your code."
      members: [architect, codebase-explorer, code-reviewer, test-strategist, test-generator, regression-analyst, change-impact-analyst]
      monthly_price: 5900
    - key: ship-safe
      name: { fr: "Ship Safe", en: "Ship Safe" }
      value:
        fr: "Livrer sans risque : API, migrations, tests, mise en production, sécurité."
        en: "Ship without risk: APIs, migrations, tests, releases, security."
      members: [api-design-reviewer, migration-planner, test-strategist, regression-analyst, deployment-release-analyst, security-reviewer]
      monthly_price: 7900
    - key: incident-response
      name: { fr: "Incident Response", en: "Incident Response" }
      value:
        fr: "Investiguer, diagnostiquer et résoudre les incidents."
        en: "Investigate, diagnose and resolve incidents."
      members: [incident-investigator, bug-investigator, dependency-analyst, performance-analyst, reliability-analyst, change-impact-analyst]
      monthly_price: 8900
    - key: security-reliability
      name: { fr: "Security & Reliability", en: "Security & Reliability" }
      value:
        fr: "Renforcer la sécurité et la fiabilité de vos systèmes."
        en: "Strengthen your systems' security and reliability."
      members: [security-reviewer, dependency-analyst, api-design-reviewer, database-specialist, reliability-analyst]
      monthly_price: 6900
    - key: frontend-craft
      name: { fr: "Frontend Craft", en: "Frontend Craft" }
      value:
        fr: "La qualité de vos interfaces : rendu, accessibilité, design, animation."
        en: "Your interfaces' quality: rendering, accessibility, design, motion."
      members: [ui-quality-reviewer, accessibility-auditor, design-reviewer, motion-animation-specialist]
      monthly_price: 2900

# The AI capacity is the plan's: never sold apart, never an overage charge.
# At the limit, billable usage pauses; a higher plan is offered, chosen
# explicitly.
capacity:
  automatic_overage: false
