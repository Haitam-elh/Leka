# LEKA CORE's commercial catalogue (LEKA-431, LEKA-446) — the ONE source of
# truth for its plans, their prices, discounts and trial, and what each
# includes. The pricing page, the API and checkout read it; nothing else
# states a price.
#
# Decided by the founder (LEKA-446, 2026-10-12/13): no agent is included in
# a plan — agents and bundles are bought apart, once on sale; the AI
# capacity is the plan's and is never sold apart — no pack, no top-up, no
# overage: at the limit, what is billable stops and a higher plan is offered.
#
# Prices are in euro cents, excluding VAT. `provisional: true` marks a launch
# hypothesis — the AI-credit allowances above all — to be revisited once
# usage and cost metering (LEKA-430) has measured real usage; it is never
# shown as a guarantee. Change a value here, in a pull request: the page
# follows, nothing else to edit.
#
# Values not decided yet are absent, never guessed: seats, sources and
# workspaces per plan; agent and bundle prices.
#
# Quotas (2026-10-14, the product call — TODO: à valider): people, sources
# connected, standard analyses a month (what the AI credits come to, about
# 20 credits each), alert rules, recurring workflows. Over its plan's, a
# workspace is offered the next plan; what it already has is kept.
#
# Monitoring (LEKA-442, decided 2026-10-13, provisional): every plan sees its
# environment's states, their freshness and coverage; proactive alerts —
# in LEKA — from Starter, by e-mail too from Growth; Enterprise by contract.
#
# The AI credits a month are NOT here: they are the ones metering grants
# (LEKA-430, LEKA_PLAN_CREDITS — 200, 2,000, 10,000, 40,000), read from it,
# so what the page promises is what a workspace gets. Enterprise's are per
# contract.

version: "2026-10-14"
currency: EUR

# 20% off when billed yearly.
annual_discount_percent: 30

# The launch offer: 30% off the first 12 months, on monthly billing only —
# never stacked with the annual discount.
launch_offer:
  percent: 20
  months: 12
  intervals: [month]
  # Until when a new subscription may take it; empty: until further notice.
  ends_on: null

plans:
  - key: free
    name: Free
    monthly_price: 0
    self_service: true
    audience:
      fr: "Découvrir LEKA sur un premier périmètre."
      en: "Try LEKA on a first scope."
    value:
      fr: "Connectez vos premières sources et posez vos premières intentions."
      en: "Connect your first sources and ask your first intentions."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: false
    annual: false
    # LEKA-442: the states, their freshness and coverage, seen; no proactive alerts.
    monitoring: { proactive: false, provisional: true }
    quotas: { users: 1, sources: 3, analyses: 10, alert_rules: 0, workflows: 0, provisional: true }

  - key: starter
    name: Starter
    monthly_price: 5900
    self_service: true
    audience:
      fr: "Une petite équipe technique qui veut une vue claire de son SI."
      en: "A small engineering team that wants a clear view of its systems."
    value:
      fr: "Le modèle de votre environnement tenu à jour, et les alertes quand quelque chose ne va pas."
      en: "A continuously updated model of your environment, and alerts when something goes wrong."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app], provisional: true }
    quotas: { users: 1, sources: 5, analyses: 100, alert_rules: 5, workflows: 0, provisional: true }

  - key: growth
    name: Growth
    monthly_price: 17900
    self_service: true
    recommended: true
    # 14 days, a card required; then the subscription starts and the card is
    # charged, unless cancelled before (decided 2026-10-12). Once a workspace.
    trial_days: 14
    audience:
      fr: "Les équipes qui pilotent leur SI au quotidien avec LEKA."
      en: "Teams that run their systems with LEKA every day."
    value:
      fr: "Plus de capacité IA pour vos architectures, vos analyses et vos intentions, sur tout votre périmètre."
      en: "More AI capacity for your architectures, analyses and intentions, across your whole scope."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app, email], provisional: true }
    quotas: { users: 5, sources: 15, analyses: 500, alert_rules: 20, workflows: 10, provisional: true }

  - key: business
    name: Business
    monthly_price: 59900
    self_service: true
    audience:
      fr: "Les organisations à plusieurs équipes et plusieurs périmètres."
      en: "Organisations with several teams and scopes."
    value:
      fr: "La capacité IA d'une organisation à plusieurs équipes, sur tout son SI."
      en: "The AI capacity of an organisation with several teams, across its systems."
    ai_credits_per_month: { provisional: true }
    managed_llm: true
    own_llm: false
    launch_offer: true
    annual: true
    monitoring: { proactive: true, alerts: [in_app, email], provisional: true }
    quotas: { users: 15, sources: 30, analyses: 2000, alert_rules: 100, workflows: 50, provisional: true }

  - key: enterprise
    name: Enterprise
    # Priced per contract: never a self-service checkout.
    monthly_price: null
    self_service: false
    audience:
      fr: "Les grandes organisations, avec leurs exigences de sécurité et leur propre modèle."
      en: "Large organisations, with their security requirements and their own model."
    value:
      fr: "Une capacité IA définie au contrat, et la possibilité de connecter votre propre modèle de langage."
      en: "AI capacity set by contract, and the option to connect your own language model."
    ai_credits_per_month: { contractual: true }
    managed_llm: true
    own_llm: true
    launch_offer: false
    annual: false
    monitoring: { proactive: true, alerts: [in_app, email], contractual: true }
    quotas: { contractual: true }

# Every agent: none in a plan, each sold individually or in bundles
# (LEKA-446). On sale from 2026-10-14 (the product call): a workspace on Free
# runs none — Starter at least — and owns an agent bought alone, or in a
# bundle. Workspaces LEKA grants every agent (its team's, for tests) are
# kept apart, in the database (billing.AgentEntitlement).
#
# TODO: à valider — every price below. Reference prices from LEKA-446,
# accepted on 2026-10-14: Standard 9 €, Spécialisé 15 €, Expert 25 € a
# month, an agent's runs paid besides in the plan's AI credits — so the
# price is the margin, whatever the agent costs to run. Bundles: about a
# quarter off their agents alone, never more than 27 %.
add_ons:
  available: true
  provisional: true
  # The least plan that runs an agent.
  minimum_plan: starter
  tiers:
    standard: 900
    specialized: 1500
    expert: 2500
  agents:
    application-architecture: expert
    code-change: expert
    security-review: expert
    incident-investigation: expert
    release-analysis: expert
    architecture-analysis: specialized
    infrastructure-analysis: specialized
    data-analysis: specialized
    debug-assistant: specialized
    build-fixer: specialized
    code-review: standard
    test-analysis: standard
    documentation-assistant: standard
  bundles:
    - key: engineering
      name: { fr: "Ingénierie", en: "Engineering" }
      value:
        fr: "Développer, relire et tester votre code."
        en: "Build, review and test your code."
      agents: [code-change, code-review, test-analysis, build-fixer]
      monthly_price: 4500
    - key: architecture
      name: { fr: "Architecture", en: "Architecture" }
      value:
        fr: "Documenter et faire évoluer votre architecture."
        en: "Document and evolve your architecture."
      agents: [application-architecture, architecture-analysis, infrastructure-analysis, documentation-assistant]
      monthly_price: 4900
    - key: ship-safe
      name: { fr: "Livrer sereinement", en: "Ship safe" }
      value:
        fr: "Sécuriser vos changements et vos mises en production."
        en: "Secure your changes and your releases."
      agents: [release-analysis, test-analysis, code-review, security-review]
      monthly_price: 5200
    - key: incident-response
      name: { fr: "Réponse aux incidents", en: "Incident response" }
      value:
        fr: "Investiguer, diagnostiquer et résoudre les incidents."
        en: "Investigate, diagnose and resolve incidents."
      agents: [incident-investigation, debug-assistant, release-analysis]
      monthly_price: 4900
    - key: security-reliability
      name: { fr: "Sécurité et fiabilité", en: "Security & reliability" }
      value:
        fr: "Renforcer la sécurité et la fiabilité de vos systèmes."
        en: "Strengthen your systems' security and reliability."
      agents: [security-review, infrastructure-analysis, data-analysis]
      monthly_price: 4200

# The AI capacity is the plan's: never sold apart, never an overage charge.
# At the limit, billable usage pauses; a higher plan is offered, chosen
# explicitly.
capacity:
  automatic_overage: false
