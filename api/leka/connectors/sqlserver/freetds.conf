# FreeTDS's configuration for LEKA's SQL Server connector, named by
# FREETDSCONF before each connection (connector.py).
#
# pymssql does not pass its `encryption` argument on to FreeTDS: with it
# alone, the login is encrypted and the session then goes in the clear
# (SQL Server's sys.dm_exec_connections says encrypt_option FALSE). This
# file is what makes FreeTDS ask for TLS, for the whole session, and refuse
# a server that does not offer it before the login is sent.
[global]
	encryption = require
	tds version = 7.4
