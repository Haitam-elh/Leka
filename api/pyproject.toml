[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leka-api"
version = "0.1.0"
description = "LEKA backend — continuous architecture mapping and evidence-backed answers"
requires-python = ">=3.12,<3.13"

dependencies = [
    # HTTP layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.6",
    # Configuration and validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Background loop
    "redis>=5.2.0",
    "rq>=2.0.0",
    # Outbound calls to connected sources
    "httpx>=0.27.2",
    # Logging
    "structlog>=24.4.0",
    # Credential encryption at rest (Fernet) — see docs/adr/005-credential-storage.md
    "cryptography>=43.0.0",
    # Password hashing (argon2id) — see docs/adr/008-opaque-sessions.md
    "argon2-cffi>=23.1.0",
    # Agent front matter
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.13.0",
    "mypy>=1.11.2",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["leka"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — linter AND formatter. No flake8, no black, no isort.
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting (replaces isort)
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — every timestamp we store is tz-aware
    "T20",       # no print()
    "SIM",       # simplifications
    "PTH",       # pathlib over os.path
    "TID",       # no relative imports reaching outside the package
    "ASYNC",     # blocking calls inside async def
    "S",         # bandit — security
    "RUF",       # ruff-specific
]
ignore = [
    "S101",      # assert: legitimate in tests
    "B008",      # function call in argument default: that IS the FastAPI Depends() idiom
]

# NOTE: architecture rule 1 (a module is reached only through its __init__.py)
# is NOT enforced here. Ruff's banned-api is per-file, so exempting a module's
# own directory would also let that module reach into everyone else's
# internals. tests/test_module_boundaries.py enforces it on the import graph
# instead, along with the dependency DIRECTION, which no linter can express.

[tool.ruff.lint.per-file-ignores]
# Migrations are generated, and Alembic's template shadows builtins.
"alembic/**" = ["N999", "A002", "E501"]
# E402: conftest redirects LEKA_DATABASE_URL before importing leka, which
# necessarily happens after a statement. The reason is documented there.
"tests/conftest.py" = ["S105", "S106", "E402"]
"tests/**" = ["S105", "S106"]
# Developer scripts talk to a terminal; that is what they are for.
# The glob is path-independent so it holds however ruff is invoked.
"**/scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["leka"]

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict. A None discovered in production three weeks later costs more
# than an annotation written today.
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["rq.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The SQLAlchemy engine is created
# once at import and its pooled connections belong to the loop that opened
# them; a fresh loop per test would hand the next test a connection whose
# loop is already closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers --cov=leka --cov-report=term-missing"
markers = [
    "integration: needs a running PostgreSQL and Redis",
]

[tool.coverage.run]
source = ["leka"]
omit = ["leka/__init__.py"]
# SQLAlchemy async runs its queries inside greenlets. Without this line
# coverage loses those frames and under-reports everything that touches the
# database: 50% instead of 82% on leka/identity/service.py, the most
# security-sensitive module we have. The threshold then guards a number that
# does not mean what it says.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
