# Alembic configuration.
#
# The database URL is deliberately absent: it is read from LEKA_DATABASE_URL
# through leka.core.config in env.py. One source of truth for settings, and no
# credentials in a file that Git tracks (architecture rule 12).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migrations sort by creation date, so `ls alembic/versions` reads in the
# order they were applied.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
