# The model each agent runs on (LEKA-530) — and LEKA's own work's.
#
# Chosen by the LEKA team: candidate models are tried on the agent's real
# work (its instructions, its tools, the deliverable it owes, how reliably,
# how fast, at what cost), then one is validated and written here. The agent
# runs on it, every step of it: no model is chosen per task while it runs.
# Changing one is engineering work: the comparative tests, then this file,
# reviewed in a pull request — never an environment variable, never a
# customer's setting.
#
#   model      provider:model, one LEKA knows (api/leka/capabilities/gateway/profiles.py)
#   fallbacks  models tested and approved for THIS agent, tried in order when
#              its model fails. None: the agent tries its model again
#              (LEKA_LLM_RETRIES), then says it failed — never an untested
#              model in its place.
#
# Every agent of registry.yaml has its line (tests/test_model_assignments.py).
# A workspace under an Enterprise contract may plug in its own model (its
# account): it answers first; when it fails, the agent's models below do,
# unless the workspace said "ours only".
#
# Trying a candidate: LEKA_LLM_TRIAL_MODEL puts every agent on one model,
# outside production only (docs/model-gateway.md).
#
# Validated so far: Gemini 3.8 Flash, the model every agent was tested on
# (October–November 2026). No fallback approved yet.

version: 1

# LEKA's own work, that no agent does: reading an intention, analysing it,
# writing its answer, the company model's enrichment, the interface's words.
operations:
  model: google:gemini-3.8-flash
  fallbacks: []

