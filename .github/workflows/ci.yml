name: CI

# Runs on every pull request. main is protected by review, not by this file —
# but nothing merges with a red pipeline.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — lint, types, migrations, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml. CI must not discover that pgvector
        # is missing on a Postgres the developers never run.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: leka
          POSTGRES_PASSWORD: leka
          POSTGRES_DB: leka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leka -d leka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      mysql:
        # A customer's MySQL, for tests/test_mysql_connector.py (LEKA-349):
        # the connector reads a real server's catalogue, over the TLS the
        # image sets up by itself. Same image as docker-compose.yml.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: leka
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pleka"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 20s

      mariadb:
        # A customer's MariaDB, for tests/test_mariadb_connector.py
        # (LEKA-349), on 3307 beside MySQL. Same image as docker-compose.yml.
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: leka
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 20s

      sqlserver:
        # A customer's SQL Server, for tests/test_sqlserver_connector.py
        # (LEKA-349): its Developer edition, free for tests. Same image as
        # docker-compose.yml.
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Leka-local-1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Leka-local-1 -C -b -Q 'SELECT 1' -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      mongodb:
        # A customer's MongoDB, for tests/test_mongodb_connector.py
        # (LEKA-349). Same image as docker-compose.yml.
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: leka
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 20s

    env:
      LEKA_DATABASE_URL: postgresql+asyncpg://leka:leka@127.0.0.1:5432/leka_test
      LEKA_REDIS_URL: redis://127.0.0.1:6379/0
      LEKA_SECRET_KEY: ci-only-not-a-real-secret
      # A throwaway Fernet key. Without it every job fails at import, which is
      # the configuration doing its job.
      LEKA_ENCRYPTION_KEYS: '["MN3nrX7VP5Mj0SRB4G-pIPOrvlCyT-CQoBZvsQFYHss="]'
      LEKA_ENVIRONMENT: ci
      # Turns a skipped S3 test into a failure. Those tests skip when no
      # server answers, which is right on a laptop and wrong in a pipeline
      # that reports the adapter as verified.
      LEKA_REQUIRE_S3_TESTS: "1"
      # The same for MySQL: its tests skip on a laptop with no server, and
      # must not here.
      LEKA_REQUIRE_MYSQL_TESTS: "1"
      LEKA_REQUIRE_MONGODB_TESTS: "1"
      LEKA_REQUIRE_MARIADB_TESTS: "1"
      LEKA_REQUIRE_SQLSERVER_TESTS: "1"
      LEKA_REQUIRE_ORACLE_TESTS: "1"

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format
        run: ruff format --check .

      - name: Ruff — scripts/
        # scripts/ lives outside api/, so it needs asking for by name. Left
        # out, it is the one directory in the repository nothing checks.
        working-directory: .
        run: |
          ruff check scripts/
          ruff format --check scripts/

      - name: mypy
        # tests/ included deliberately: a typing error there passes CI if it
        # is left out, and fails on the next person's machine instead.
        run: mypy leka/ tests/

      - name: Alembic — migrations apply to an empty database
        run: alembic upgrade head

      - name: Alembic — every migration's downgrade actually runs
        # Reversibility was a promise nothing checked: three alembic calls
        # existed before this one, two "upgrade head" and a "check", zero
        # "downgrade". A migration whose downgrade() referenced a constraint
        # name that did not exist at runtime (LEKA-336) merged and stayed
        # broken for two days because nothing ever walked the path back down.
        # DDL is transactional per step, so a broken downgrade here fails
        # loudly and leaves the database exactly as upgrade head left it —
        # this never risks a real one, only the throwaway CI database.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Alembic — models and migrations agree
        # Catches the classic mistake: a column changed on the model with no
        # migration written for it.
        run: alembic check

      - name: Start Oracle
        # A customer's Oracle, for tests/test_oracle_connector.py (LEKA-349).
        # A step, not a service container: its TLS is set up by
        # tests/oracle/tcps.sh, mounted from the checkout, which a service
        # starts before. Oracle Database Free, packaged for containers by
        # Gerald Venzl — the image Testcontainers uses; a third party's, so
        # pinned by digest, as MinIO below. Same as docker-compose.yml.
        working-directory: .
        run: |
          docker run -d --name oracle -p 1521:1521 -p 2484:2484 \
            -e ORACLE_PASSWORD=Leka-local-1 \
            -v "$PWD/api/tests/oracle:/container-entrypoint-startdb.d:ro" \
            gvenzl/oracle-free:23-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
          for _ in $(seq 1 120); do
            if docker logs oracle 2>&1 | grep -q "DATABASE IS READY TO USE" \
              && (echo > /dev/tcp/127.0.0.1/2484) 2>/dev/null; then
              echo "Oracle is up, TLS on 2484"; exit 0
            fi
            sleep 2
          done
          echo "Oracle did not become ready in 240s"; docker logs oracle; exit 1

      - name: Start MinIO
        # Not a service container: those cannot pass a command, and MinIO
        # needs `server /data`. A step is explicit and works.
        #
        # This is what stops tests/test_s3_against_minio.py from skipping.
        # It is the only thing exercising S3ObjectStore against a server we
        # did not write ourselves — and the difference is not academic: a
        # stand-in accepts a delete of more than 1000 keys, real S3 refuses.
        #
        # WHICH IMAGE. MinIO stopped publishing images: quay.io/minio/minio
        # answers 401 and minio/minio on Docker Hub is gone (found on
        # 2026-09-25, when this step failed on every branch). pgsty/minio is
        # the same MinIO server, rebuilt and published by the Pigsty project
        # — same command, same variables, same health endpoint. Pinned by
        # digest: a third party's image runs in CI, so it is this exact one
        # or none. Tests only; nothing in production uses it.
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy in 30s"; docker logs minio; exit 1

      - name: pytest
        # 80, not 60. Coverage used to lose SQLAlchemy's greenlet frames and
        # report 79% for a suite that really covers 87%; at that reading a
        # 60% floor protected nothing. See concurrency in pyproject.toml.
        run: pytest --cov-fail-under=80

  web:
    name: web — lint, types, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: e2e — the sign-in journey in a real browser
    runs-on: ubuntu-latest
    # Runs after the other two: if the unit tests or the build are broken,
    # a browser failure tells you nothing you do not already know, and this
    # job is the slow one.
    needs: [api, web]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: leka
          POSTGRES_PASSWORD: leka
          POSTGRES_DB: leka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leka -d leka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      LEKA_DATABASE_URL: postgresql+asyncpg://leka:leka@localhost:5432/leka
      LEKA_REDIS_URL: redis://localhost:6379/0
      LEKA_SECRET_KEY: ci-only-not-a-real-secret
      LEKA_ENCRYPTION_KEYS: '["MN3nrX7VP5Mj0SRB4G-pIPOrvlCyT-CQoBZvsQFYHss="]'
      LEKA_ENVIRONMENT: ci
      # The browser refuses to store a Secure cookie over http, and these
      # tests speak http. The production value is asserted in the Python
      # suite, which needs no browser to check it.
      LEKA_SESSION_COOKIE_SECURE: "false"
      # localhost on both sides. A browser treats localhost and 127.0.0.1 as
      # different SITES, so a SameSite=Lax cookie set by one is never sent to
      # the other — the defect this whole job exists to catch.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Playwright resolves the API interpreter from this rather than from a
      # virtualenv, which a runner does not have.
      LEKA_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install the API
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Create the schema
        working-directory: api
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web app
        working-directory: web
        run: npm ci

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: TypeScript types match the API
        working-directory: web
        # web/lib/api-types.ts is generated from the OpenAPI schema and
        # committed. Nothing else notices when it drifts: the web job type-
        # checks against a stale file and passes, and the mismatch surfaces
        # as a runtime error in front of a user. This is the only job with a
        # running API, so the check belongs here.
        run: |
          ${LEKA_PYTHON} -m uvicorn leka.main:app --port 8000 --app-dir ../api &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health > /dev/null && break
            sleep 1
          done
          npm run gen:api
          kill %1
          if ! git diff --exit-code -- lib/api-types.ts; then
            echo "::error::lib/api-types.ts is out of date. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

      - name: Install Chromium
        working-directory: web
        # --with-deps: the runner has none of the shared libraries a browser
        # needs.
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: web
        run: npm run e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test-results/ holds each failure's trace and error-context.md.
          # playwright-report/ alone was empty: the reporter is "list", so
          # every failure so far left nothing to open.
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
