name: CD

# Only after CI has gone green on main. `workflow_run` rather than a second
# `push` trigger, because the acceptance criterion is that code moves through
# a VALIDATED pipeline: a deployment that starts in parallel with the tests
# is a deployment that can beat them to the box.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Rollback, and redeploying a known-good commit. An image that already
  # exists in the registry is deployed as it is, never rebuilt: what goes
  # out is byte for byte what went out the first time.
  workflow_dispatch:
    inputs:
      release:
        description: The commit to deploy — a sha, full or short. Leave empty for the current HEAD of main.
        required: false
        type: string

concurrency:
  # Never two deployments at once on one box: the second `up -d` would race
  # the first while it is still pulling.
  group: cd-production
  cancel-in-progress: false

jobs:
  build:
    name: build and push the two images
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Two conditions, and the first one matters most today.
    #
    # PRODUCTION_ENABLED is a repository variable that does not exist until
    # the box is ready. Until somebody sets it to "true", this whole workflow
    # is skipped — so merging it costs nothing, runs nothing and bills
    # nothing. A pipeline that fails on every merge because it has nowhere to
    # deploy teaches people to ignore a red tick, which is the one habit CI
    # cannot survive.
    #
    # Repository variables, not secrets: the `secrets` context is not
    # available in a job-level `if`, and this is not a secret anyway.
    #
    # The second: a red CI must not reach the box, and neither must a CI run
    # that was not a push to main — a pull request from a branch that happens
    # to be called main passes the `branches` filter above. The manual path
    # skips both because it deploys a commit whose CI already passed.
    if: >-
      vars.PRODUCTION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.what.outputs.registry }}
      release: ${{ steps.what.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The input goes through the checkout, never into a shell: a
          # string typed into a form must not become a command.
          ref: ${{ inputs.release || github.event.workflow_run.head_sha || github.sha }}

      - name: Work out what is being deployed
        id: what
        run: |
          # The full sha, whatever was typed. A short one would tag a second
          # copy of an image that already exists under the long one.
          RELEASE="$(git rev-parse HEAD)"
          # An image reference must be lower case, and a GitHub owner or
          # repository name need not be: `ghcr.io/Haitam-elh/...` is refused
          # outright. Derived from the repository, so moving it to an
          # organisation moves the images with it.
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REGISTRY}/{api,web}:${RELEASE}"

      - name: The web build needs the API's public address
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          # Baked into the JavaScript at build time (see web/Dockerfile). An
          # empty value would build an app that calls nothing.
          case "$PROD_API_URL" in
            https://*) echo "Web app will call ${PROD_API_URL}" ;;
            *) echo "::error::Set the repository variable PROD_API_URL, e.g. https://api.leka-core.com"; exit 1 ;;
          esac

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Are they already built?
        id: existing
        run: |
          # Per image: a rerun after the web build failed must not rebuild
          # an API that is already in the registry.
          for image in api web; do
            if docker buildx imagetools inspect "${{ steps.what.outputs.registry }}/${image}:${{ steps.what.outputs.release }}" > /dev/null 2>&1; then
              echo "${image}=true" >> "$GITHUB_OUTPUT"
              echo "${image}: already in the registry, deployed as it is."
            else
              echo "${image}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # On the self-hosted runner (CI_RUNS_ON set: a VM on an ARM Mac), Docker's
      # own builder, which runs x86 through Rosetta. buildx's default, a
      # builder in a container, brings its own QEMU instead, and Next.js's
      # build crashes under it (SIGSEGV, 2026-10-09). Docker's builder sends
      # no cache to GitHub (its layers stay on that machine between runs) and
      # is asked for no provenance, which not every Docker store can hold.
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.api != 'true' || steps.existing.outputs.web != 'true'
        with:
          driver: ${{ vars.CI_RUNS_ON && 'docker' || 'docker-container' }}

      - name: Build and push the API
        if: steps.existing.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: api
          # The agents, from the repository's root (api/Dockerfile).
          build-contexts: agents=agents
          # The production box is x86: said, so that a self-hosted runner on
          # an ARM Mac builds for it too.
          platforms: linux/amd64
          push: true
          # The sha and nothing else. No `latest`: a moving tag means
          # "what is running?" has no answer and rollback has no target.
          tags: ${{ steps.what.outputs.registry }}/api:${{ steps.what.outputs.release }}
          # Links the package to this repository, which is what lets the
          # deploy job's token pull it, and says which commit it is.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.what.outputs.release }}
          cache-from: ${{ !vars.CI_RUNS_ON && 'type=gha,scope=api' || '' }}
          cache-to: ${{ !vars.CI_RUNS_ON && 'type=gha,mode=max,scope=api' || '' }}
          provenance: ${{ vars.CI_RUNS_ON && 'false' || '' }}

      - name: Build and push the web app
        if: steps.existing.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL }}
          tags: ${{ steps.what.outputs.registry }}/web:${{ steps.what.outputs.release }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.what.outputs.release }}
          cache-from: ${{ !vars.CI_RUNS_ON && 'type=gha,scope=web' || '' }}
          cache-to: ${{ !vars.CI_RUNS_ON && 'type=gha,mode=max,scope=web' || '' }}
          provenance: ${{ vars.CI_RUNS_ON && 'false' || '' }}

      # Docker's own builder keeps what it built on the self-hosted runner:
      # every release's two images, and their build cache, on a 19 GB disk
      # that CI's databases share. On 2026-10-13 they could no longer write
      # (No space left on device). The images are in the registry once
      # pushed; the cache keeps what the next build reuses, for a day.
      - name: Leave the runner its disk
        if: always() && vars.CI_RUNS_ON
        run: |
          docker image rm "${{ steps.what.outputs.registry }}/api:${{ steps.what.outputs.release }}" \
            "${{ steps.what.outputs.registry }}/web:${{ steps.what.outputs.release }}" > /dev/null 2>&1 || true
          docker builder prune -f --filter until=24h
          docker system df

  deploy:
    name: deploy to production, and undo it if it does not come up
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: build
    environment: production
    permissions:
      contents: read
      # The box pulls with this job's token.
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Send the deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: deploy/docker-compose.production.yml,deploy/Caddyfile,deploy/deploy.sh
          target: /opt/leka
          strip_components: 1

      - name: Deploy, verify, and roll back if it did not come up
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          RELEASE: ${{ needs.build.outputs.release }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: REGISTRY,RELEASE
          # Everything that decides anything is in deploy.sh, which is what
          # the local rehearsal runs. See docs/deployment.md.
          script: |
            set -eu
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            bash /opt/leka/deploy.sh "$REGISTRY" "$RELEASE"
